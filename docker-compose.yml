services:
  # ── Kaiser AI Unified Web & ML Platform ─────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kaiser_ai_platform
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://kaiser_user:${DB_PASSWORD}@db:5432/kaiser_civic
      - JWT_SECRET=${JWT_SECRET}
      - AI_DETECTOR_MODEL_DIR=/app/backend/models/ai_detector
      # AI Keys (set in .env or CI secrets)
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      # CORS
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
    volumes:
      - grievance_uploads:/app/backend/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ── PostgreSQL with PostGIS Spatial Extensions ──────────────────────────────
  db:
    image: postgis/postgis:16-3.4
    container_name: kaiser_postgis_db
    # NOTE: Port 5432 is NOT exposed to the host for security.
    # Access via the Docker network only (web service connects via hostname 'db').
    environment:
      - POSTGRES_USER=kaiser_user
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=kaiser_civic
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaiser_user -d kaiser_civic"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgis_data:
  grievance_uploads:
